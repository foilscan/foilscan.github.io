# Cada día actualiza los datos que descarga la app FoilScan: precios de Cardmarket, fotos de reserva de las cartas sin
# imagen, fotos oficiales en español y la lista de cartas de One Piece en japonés.
name: Datos diarios
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Los precios primero: si falla otro paso, se guardan igual.
      - name: Precios de Cardmarket
        run: python3 scripts/precios.py data/precios-cardmarket.json
        continue-on-error: true
      - name: Fotos de reserva
        run: python3 scripts/imagenes.py data/imagenes-cartas.json
        continue-on-error: true
      - name: Fotos oficiales en español
        run: python3 scripts/imagenes_es.py data/imagenes-es.json
        continue-on-error: true
      - name: One Piece en japonés
        run: python3 scripts/onepiece_ja.py data/onepiece-ja.json
        continue-on-error: true
      - name: Guardar si ha cambiado
        run: |
          if git diff --quiet -- data/; then exit 0; fi
          git config user.name "FoilScan"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Datos actualizados"
          git push
